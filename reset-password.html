<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - FLEX HUB PREDICTIONS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #111;
    }

    .reset-container {
      width: 100%;
      max-width: 430px;
      background: #fff;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
    }

    .logo {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
      font-size: 14px;
    }

    h2 {
      text-align: center;
      margin: 0 0 20px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #111;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 7px;
      background: #111;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      margin-top: 5px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 15px;
      font-size: 14px;
      line-height: 1.4;
    }

    .success {
      background: #d1e7dd;
      color: #0f5132;
    }

    .error {
      background: #f8d7da;
      color: #842029;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #111;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="reset-container">

    <div class="logo">
      FLEX HUB PREDICTIONS
    </div>

    <div class="subtitle">
      Secure Password Reset
    </div>

    <h2>Reset Password</h2>

    <div id="message" class="message"></div>

    <form id="resetPasswordForm">

      <label for="newPassword">
        New Password
      </label>

      <input
        id="newPassword"
        type="password"
        placeholder="Enter your new password"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <label for="confirmPassword">
        Confirm New Password
      </label>

      <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm your new password"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <button id="resetButton" type="submit">
        Reset Password
      </button>

    </form>

    <a
      class="back-link"
      href="https://flexhubpredictions.com"
    >
      Back to FLEX HUB PREDICTIONS
    </a>

  </div>

  <script>
    const API_URL =
      "https://flex-hub-prediction.onrender.com/api";

    const form =
      document.getElementById("resetPasswordForm");

    const newPassword =
      document.getElementById("newPassword");

    const confirmPassword =
      document.getElementById("confirmPassword");

    const resetButton =
      document.getElementById("resetButton");

    const message =
      document.getElementById("message");


    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
      message.style.display = "block";
    }


    const urlParams =
      new URLSearchParams(window.location.search);

    const token =
      urlParams.get("token");


    if (!token) {

      showMessage(
        "This password reset link is invalid or missing.",
        "error"
      );

      resetButton.disabled = true;
    }


    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      if (!token) {
        return;
      }

      const password =
        newPassword.value;

      const confirm =
        confirmPassword.value;


      if (password.length < 6) {

        showMessage(
          "Password must be at least 6 characters.",
          "error"
        );

        return;
      }


      if (password !== confirm) {

        showMessage(
          "The passwords do not match.",
          "error"
        );

        return;
      }


      resetButton.disabled = true;
      resetButton.textContent = "Resetting...";

      message.style.display = "none";


      try {

        const response =
          await fetch(
            API_URL + "/reset-password",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                token: token,
                password: password
              })
            }
          );


        const data =
          await response.json();


        if (!response.ok || !data.success) {

          showMessage(
            data.message ||
            "Unable to reset your password.",
            "error"
          );

          resetButton.disabled = false;
          resetButton.textContent = "Reset Password";

          return;
        }


        showMessage(
          "Password reset successfully. You can now log in with your new password.",
          "success"
        );


        resetButton.disabled = true;
        resetButton.textContent = "Password Reset";


        setTimeout(function() {
          window.location.href =
            "https://flexhubpredictions.com";
        }, 3000);


      } catch (error) {

        console.error(
          "Password reset request failed:",
          error
        );

        showMessage(
          "Unable to reset your password right now. Please try again.",
          "error"
        );

        resetButton.disabled = false;
        resetButton.textContent = "Reset Password";
      }

    });
  </script>

</body>
</html>
